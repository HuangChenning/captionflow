name: CaptionFlow
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
targets:
  CaptionFlow:
    type: application
    platform: macOS
    sources:
      - CaptionFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taihongteng.CaptionFlow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "CaptionFlow needs microphone access to generate live captions from your speech."
        CODE_SIGN_ENTITLEMENTS: CaptionFlow/CaptionFlow.entitlements
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
  CaptionFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CaptionFlowTests
    dependencies:
      - target: CaptionFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
