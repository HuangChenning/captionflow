<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>CaptionFlow</title>
<desc>A sound wave above a frosted caption plate with a white line and a yellow line.</desc>
<defs>
<linearGradient id="cf-bg" x1="0.2" y1="0" x2="0.8" y2="1">
<stop offset="0" stop-color="#4F7DFF"></stop>
<stop offset="1" stop-color="#2B2E9E"></stop>
</linearGradient>
<linearGradient id="cf-sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.28"></stop>
<stop offset="0.45" stop-color="#ffffff" stop-opacity="0"></stop>
</linearGradient>
<linearGradient id="cf-bar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"></stop>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.72"></stop>
</linearGradient>
<linearGradient id="cf-glass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.26"></stop>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.10"></stop>
</linearGradient>
<linearGradient id="cf-yellow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFE27A"></stop>
<stop offset="1" stop-color="#FFC21F"></stop>
</linearGradient>
<filter id="cf-shadow" x="-20%" y="-20%" width="140%" height="150%">
<feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1030" flood-opacity="0.32"></feDropShadow>
</filter>
<filter id="cf-soft" x="-20%" y="-20%" width="140%" height="160%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1030" flood-opacity="0.22"></feDropShadow>
</filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#cf-bg)" filter="url(#cf-shadow)"></rect>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#cf-sheen)"></rect>
<rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"></rect>
<g fill="url(#cf-bar)" filter="url(#cf-soft)">
<rect x="274" y="332" width="44" height="100" rx="22"></rect>
<rect x="346" y="286" width="44" height="192" rx="22"></rect>
<rect x="418" y="230" width="44" height="304" rx="22"></rect>
<rect x="490" y="262" width="44" height="240" rx="22"></rect>
<rect x="562" y="216" width="44" height="332" rx="22"></rect>
<rect x="634" y="294" width="44" height="176" rx="22"></rect>
<rect x="706" y="330" width="44" height="104" rx="22"></rect>
</g>
<g filter="url(#cf-soft)">
<rect x="212" y="600" width="600" height="212" rx="60" fill="url(#cf-glass)"></rect>
</g>
<rect x="213" y="601" width="598" height="210" rx="59" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="2"></rect>
<rect x="322" y="648" width="380" height="34" rx="17" fill="#ffffff" fill-opacity="0.82"></rect>
<rect x="276" y="712" width="472" height="56" rx="28" fill="url(#cf-yellow)"></rect>
</svg>
