<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">CaptionFlow</title>
<desc id="d">CaptionFlow turns English speech into live translated captions on a Mac: an English waveform is recognized locally, translated by an LLM, and shown as a caption bar with the English line and its Chinese translation.</desc>
<rect width="1200" height="440" rx="24" fill="#F5F7FA"/>
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif">
